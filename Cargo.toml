[package]
name = "msfs-popout-panel-manager-rs"
version = "0.1.0"
edition = "2024"
description = "Rust port of MSFS Pop Out Panel Manager (pop out, save and position MSFS 2020 pop out panels)"
# Derivative work of https://github.com/hawkeye-stan/msfs-popout-panel-manager (AGPL-3.0)
license = "AGPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "7"
log = "0.4"
xmltree = "0.12"
libloading = "0.9"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"

# Warnings are always errors.
[lints.rust]
warnings = "deny"

[lints.cargo]
# The crate only fully compiles on Windows: on a Linux `cargo check` every module
# except the `main` stub is cfg'd out, so the manifest dependency lint would
# flag dependencies that the Windows build (and `cargo test`) really uses.
unused_dependencies = "allow"
