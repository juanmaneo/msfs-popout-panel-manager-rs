name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Build and test (Windows x64)
    # The crate only fully compiles on Windows (everything but a `main` stub is cfg(windows)),
    # so a Linux runner would not exercise the real code.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
          rustc -Vv
          cargo -V

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked --all-targets

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: msfs-popout-panel-manager-rs-windows-x64
          path: |
            target/release/msfs-popout-panel-manager-rs.exe
            LICENSE
            README.md
          if-no-files-found: error
